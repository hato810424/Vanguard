# nginx の upstream は host.docker.internal（= Docker デーモンが動くマシン、多くの場合 WSL2）。
# Docker Engine を WSL 内だけで動かしているとき、Node を Windows 側だけで起動していると 3000/3001 に届かない。
# 同じ WSL で `pnpm dev`（web と auth）を起動するか、Docker Desktop（Windows 統合）側の構成に合わせること。
services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - vanguard

  auth:
    build:
      context: .
      dockerfile: docker/auth/Dockerfile
    environment:
      DB_FILE_NAME: /data/auth.db
    volumes:
      - auth_data:/data
    expose:
      - "3001"
    networks:
      - vanguard

volumes:
  auth_data:

networks:
  vanguard:
    driver: bridge
