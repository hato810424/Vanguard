# host.docker.internal は compose の extra_hosts で /etc/hosts に入る。
# resolver 127.0.0.11 + 変数 proxy_pass は埋め込み DNS 参照になり hosts を使わず失敗するため、
# upstream で起動時解決（getaddrinfo → /etc/hosts）にする。
upstream vanguard_dev_web {
    server auth:3001;
}

upstream vanguard_dev_auth {
    server auth:3001;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    absolute_redirect off;

    client_max_body_size 1m;

    # auth_request 用サブリクエスト（外部からは internal のため 404）
    location = /_auth/api/verify {
        internal;
        proxy_pass http://vanguard_dev_auth/_auth/api/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $http_host;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Original-URI $request_uri;
    }

    location /_auth {
        proxy_pass http://vanguard_dev_auth;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        auth_request /_auth/api/verify;
        error_page 401 = @login_redirect;

        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ =404;
    }

    location @login_redirect {
        return 302 /_auth?next=$uri;
    }
}
